name: Backend verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Install only locked backend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check src/app.js
          node --check src/server.js
          node --check security.js
          node --check models/Emergency.js
          node --check test/security.test.js
          node --check test/api-contracts.test.js
      - name: Run isolated security, startup and API contract tests
        run: npm test
